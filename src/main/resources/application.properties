# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:bookmarkdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA Properties
spring.jpa.hibernate.ddl-auto=update # Automatically update schema (create-drop for testing, update or validate for dev/prod)
spring.jpa.show-sql=true # Show SQL queries in logs, useful for debugging
spring.jpa.properties.hibernate.format_sql=true # Format SQL queries in logs

# Server port (optional, default is 8080)
# server.port=8081
